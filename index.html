    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cor-texto: #3a3330;
            --cor-suave: #8a7f78;
            --cor-destaque: #b98b7b;      /* rosé / nude */
            --cor-destaque-escuro: #9c6f60;
            --cor-fundo: #ffffff;
            --cor-bege: #f7f2ee;
            --cor-linha: #eadfd8;
            --fonte-titulo: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
            --fonte-texto: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            font-family: var(--fonte-texto);
            font-weight: 300;
            background: var(--cor-fundo);
            color: var(--cor-texto);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== CABEÇALHO ===== */
        header {
            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(8px);
            padding: 1.2rem 2rem;
            border-bottom: 1px solid var(--cor-linha);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .cabecalho-conteudo {
            max-width: 1400px; margin: 0 auto;
            display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 1rem;
        }
        .logo {
            font-family: var(--fonte-titulo);
            font-size: 2rem; font-weight: 500; font-style: italic;
            color: var(--cor-texto); letter-spacing: 1px;
        }
        .navegacao { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem 2.2rem; }
        .navegacao a {
            margin-left: 0; text-decoration: none; color: var(--cor-texto);
            font-size: 0.78rem; font-weight: 400; letter-spacing: 2px; text-transform: uppercase;
            padding-bottom: 4px; border-bottom: 1px solid transparent;
            transition: color 0.3s, border-color 0.3s;
        }
        .navegacao a:hover, .navegacao a.ativo { color: var(--cor-destaque-escuro); border-color: var(--cor-destaque); }

        /* ===== FAIXA DE ABERTURA (fina, translúcida, mesma cor do rodapé) ===== */
        .hero {
            text-align: center; padding: 2rem 2rem 2.2rem;
            background: rgba(247, 242, 238, 0.85);
            border-bottom: 1px solid var(--cor-linha);
        }
        .hero h1 { line-height: 1.1; font-weight: 400; }
        .hero-colecao {
            display: block;
            font-family: var(--fonte-texto);
            font-size: 0.95rem; font-weight: 400; letter-spacing: 6px; text-transform: uppercase;
            color: var(--cor-suave); margin-bottom: 0.3rem;
        }
        .hero-nome {
            display: block;
            font-family: var(--fonte-titulo);
            font-size: 4rem; font-weight: 500; font-style: italic; letter-spacing: 1px;
            color: var(--cor-texto);
        }
        .hero p {
            font-family: var(--fonte-titulo);
            font-size: 2.1rem; font-weight: 500; font-style: italic; line-height: 1.2;
            color: var(--cor-destaque-escuro);
            margin-top: 0.6rem;
        }

                .secao { display: none; }
        .secao.visivel { display: block; }

        .container { max-width: 1400px; margin: 2.5rem auto 4rem; padding: 0 2rem; }
        .titulo-secao {
            text-align: center; font-family: var(--fonte-titulo);
            font-size: 2rem; font-weight: 500; letter-spacing: 1px;
            margin-bottom: 2.5rem; color: var(--cor-texto);
        }

        /* ===== GRADE ADAPTÁVEL (masonry): cada imagem mantém sua proporção ===== */
        .grade { column-width: 260px; column-gap: 2rem; }
        .card {
            display: inline-block; width: 100%;
            margin-bottom: 2.2rem; break-inside: avoid;
            background: transparent;
        }
        .card.clicavel { cursor: pointer; }

        .card-imagem {
            width: 100%; overflow: hidden; background: var(--cor-bege);
            aspect-ratio: 768 / 1376; border-radius: 3px;
        }
        .card-imagem.carregada { aspect-ratio: auto; }
        .card-imagem img { display: block; width: 100%; height: auto; transition: transform 0.6s ease; }
        .card:hover .card-imagem img { transform: scale(1.03); }
        .card-imagem.indisponivel {
            display: flex; align-items: center; justify-content: center;
            min-height: 200px; color: var(--cor-suave); font-size: 0.85rem; text-align: center; padding: 1rem;
        }

        .card-nome {
            padding: 1rem 0 0; text-align: center;
            font-family: var(--fonte-titulo); font-size: 1.5rem; font-weight: 500;
            letter-spacing: 1px; color: var(--cor-texto);
        }
        .card-info { padding: 0.9rem 0 0; text-align: center; }
        .card-categoria {
            font-size: 0.68rem; color: var(--cor-suave); text-transform: uppercase;
            letter-spacing: 2.5px; margin-bottom: 0.2rem;
        }
        .card-titulo {
            font-family: var(--fonte-titulo); font-size: 1.35rem; font-weight: 500;
            margin-bottom: 0.5rem; color: var(--cor-texto);
        }
        .card-descricao { margin-bottom: 1rem; }
        .card-descricao p { font-size: 0.88rem; font-weight: 400; line-height: 1.55; color: #4a403b; }

        .botao-interesse {
            display: block; width: 100%; padding: 0.75rem;
            background: transparent; color: var(--cor-texto);
            border: 1px solid var(--cor-destaque); border-radius: 2px;
            font-family: var(--fonte-texto); font-size: 0.72rem; font-weight: 500;
            letter-spacing: 2.5px; text-transform: uppercase; text-decoration: none; text-align: center;
            cursor: pointer; transition: background 0.3s, color 0.3s;
        }
        .botao-interesse:hover { background: var(--cor-destaque); color: #fff; }

        /* ===== CATÁLOGO ===== */
        .catalogo-secao { background: var(--cor-fundo); }
        .voltar-btn {
            background: transparent; border: none; color: var(--cor-suave);
            font-family: var(--fonte-texto); font-size: 0.78rem; letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; margin-bottom: 1.8rem; transition: color 0.3s;
        }
        .voltar-btn:hover { color: var(--cor-destaque-escuro); }

        .filtros { margin-bottom: 2.8rem; display: flex; gap: 0.4rem 1.8rem; flex-wrap: wrap; justify-content: center; }
        .botao-filtro {
            padding: 0.4rem 0; border: none; background: transparent; cursor: pointer;
            font-family: var(--fonte-texto); font-size: 0.78rem; font-weight: 400;
            letter-spacing: 2px; text-transform: uppercase; color: var(--cor-suave);
            border-bottom: 1px solid transparent; transition: color 0.3s, border-color 0.3s;
        }
        .botao-filtro.ativo, .botao-filtro:hover { color: var(--cor-texto); border-bottom-color: var(--cor-destaque); }

        /* ===== CATEGORIAS DA PÁGINA PRINCIPAL ===== */
        .grade-categorias { display: flex; flex-wrap: wrap; justify-content: center; gap: 2.5rem 2rem; }
        .grade-categorias .card { width: 260px; margin-bottom: 0; display: block; }
        .grade-categorias .card-imagem,
        .grade-categorias .card-imagem.carregada { aspect-ratio: 3 / 4; }
        .grade-categorias .card-imagem img { height: 100%; object-fit: cover; object-position: center 25%; }

        /* ===== QUEM SOMOS (landing só com imagens) ===== */
        .landing { max-width: 900px; margin: 0 auto; background: #fff; }
        .landing .card-imagem { border-radius: 0; background: var(--cor-bege); }
        .landing .card-imagem img { width: 100%; height: auto; display: block; }

        /* ===== RODAPÉ (claro) ===== */
        footer {
            background: var(--cor-bege); color: var(--cor-texto);
            padding: 3.5rem 2rem; text-align: center;
            border-top: 1px solid var(--cor-linha);
            font-size: 0.9rem;
        }
        .rodape-nome { font-family: var(--fonte-titulo); font-style: italic; font-weight: 500; font-size: 2rem; margin-bottom: 0.8rem; }
        footer a { color: var(--cor-destaque-escuro); text-decoration: none; }
        footer a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            header { padding: 1rem; }
            .cabecalho-conteudo { flex-direction: column; gap: 0.6rem; }
            .navegacao { gap: 0.5rem 1.4rem; }
            .navegacao a { margin: 0; font-size: 0.7rem; letter-spacing: 1.5px; }
            .hero { padding: 1.5rem 1rem 1.7rem; }
            .hero-colecao { font-size: 0.8rem; letter-spacing: 4px; }
            .hero-nome { font-size: 2.8rem; }
            .hero p { font-size: 1.6rem; }
            .container { padding: 0 1rem; margin-top: 2rem; }
            .grade { column-width: 160px; column-gap: 1rem; }
            .card { margin-bottom: 1.6rem; }
            .card-nome { font-size: 1.25rem; }
            .card-titulo { font-size: 1.15rem; }
            .botao-interesse { font-size: 0.64rem; letter-spacing: 1.5px; padding: 0.7rem 0.3rem; }
            .grade-categorias { gap: 1.8rem 1rem; }
            .grade-categorias .card { width: calc(50% - 0.5rem); }
            .filtros { gap: 0.3rem 1.1rem; }
        }

        /* ===== CATÁLOGO: ordem de leitura (esquerda → direita) e variações lado a lado ===== */
        :root { --fonte-codigo: 'DM Mono', ui-monospace, 'Courier New', monospace; }

        .grade {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 2.8rem 2rem;
            align-items: start;
            column-width: auto;
        }
        .grade .card { margin-bottom: 0; display: block; }

        .produto-grupo .grupo-itens { display: grid; gap: 0 1.2rem; align-items: start; }
        .produto-grupo .variacao { min-width: 0; }

        /* código do produto: fonte monoespaçada (todos os caracteres do mesmo tamanho) */
        .card-titulo {
            font-family: var(--fonte-codigo);
            font-size: 0.95rem; font-weight: 500; letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 600px) {
            .grade { grid-template-columns: repeat(2, 1fr); gap: 2rem 1rem; }
            .produto-grupo .grupo-itens { gap: 0 0.8rem; }
            .card-titulo { font-size: 0.8rem; letter-spacing: 0.5px; }
        }
    </style>
</head>

                id: 'mini-ecobags', nome: 'Mini Ecobags', singular: 'Mini Ecobag', capa: 'JCk7f4f',
                descricao: ['Tamanho: 17 x 24 cm', 'Tecido: algodão cru forrada'],
                imagens: ['z6dGx1V','4q0LVtb','G3vjh87','gtN2apW','VUNLBQx','PtsQZAv','dFzo1mI','fwYltdt','9mDSNBW','2tbVgqa','AMuq06I','JdF8k6g','xW30zK5','kleDIbP','VYu1NdG','8H3GURL','MNTJUnJ','qPjosr0']
            }
        ];

        // ================= FUNÇÕES AUXILIARES =================
        const $ = (id) => document.getElementById(id);
        const EXTENSOES = ['jpeg', 'jpg', 'png', 'webp', 'gif'];
        const url = (codigo, ext = 'jpeg') => IMGUR + codigo + '.' + ext;

        function linkWhatsApp(produto) {
            const msg = `Olá! Tenho interesse no produto: ${produto}`;
            return `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
        }

        // Cria a imagem e, ao carregar, libera a proporção original (9:16, quadrada, etc.)
        function criarImagem(codigo, alt) {
            const caixa = document.createElement('div');
            caixa.className = 'card-imagem';
            const img = document.createElement('img');
            img.alt = alt;
            img.loading = 'lazy';
            img.referrerPolicy = 'no-referrer'; // evita bloqueio de imagem por referência (hotlink)
            let tentativa = 0;
            const liberar = () => caixa.classList.add('carregada');
            img.addEventListener('load', liberar);
            img.addEventListener('error', () => {
                tentativa++;
                if (tentativa < EXTENSOES.length) {
                    img.src = url(codigo, EXTENSOES[tentativa]); // tenta .jpg, .png, .webp, .gif
                } else {
                    caixa.textContent = 'Imagem indisponível';
                    caixa.classList.add('carregada', 'indisponivel');
                }
            });
            img.src = url(codigo, EXTENSOES[0]);
            caixa.appendChild(img);
            if (img.complete && img.naturalWidth > 0) liberar();
            return caixa;
        }

        // ================= CONSTRUÇÃO DA PÁGINA =================
        function montarCategorias() {
            const grade = $('grade-categorias');
            CATEGORIAS.forEach(cat => {
                const card = document.createElement('div');
                card.className = 'card clicavel';
                card.appendChild(criarImagem(cat.capa, cat.nome));
                const nome = document.createElement('h3');
                nome.className = 'card-nome';
                nome.textContent = cat.nome;
                card.appendChild(nome);
                card.addEventListener('click', () => mostrarCatalogo(cat.id));
                grade.appendChild(card);
            });
        }

        function montarFiltros() {
            const filtros = $('filtros');
            const itens = [{ id: 'todos', nome: 'Todos' }, ...CATEGORIAS];
            itens.forEach(item => {
                const b = document.createElement('button');
                b.className = 'botao-filtro';
                b.dataset.categoria = item.id;
                b.textContent = item.nome;
                b.addEventListener('click', () => aplicarFiltro(item.id));
                filtros.appendChild(b);
            });
        }

        function nomeDoProduto(cat, codigo, i) {
            const especial = cat.especiais && cat.especiais[codigo];
            if (especial && especial.nome) return especial.nome;
            if (NOMES[codigo]) return NOMES[codigo];
            if (cat.nomes && cat.nomes[i]) return cat.nomes[i];
            return `${cat.singular} ${String(i + 1).padStart(2, '0')}`;
        }

        // Ordena pela sequência numérica do código e junta variações
        // (ex.: KF-NP-003L + KF-NP-003M => um bloco com as duas lado a lado)
        function agruparProdutos(cat) {
            const itens = cat.imagens.map((codigo, i) => {
                const nome = nomeDoProduto(cat, codigo, i);
                const m = nome.match(/^(.*\d)([A-Za-z])$/); // termina em número + letra
                return { codigo, nome, base: m ? m[1] : nome, sufixo: m ? m[2].toUpperCase() : '' };
            });
            itens.sort((a, b) => a.nome.localeCompare(b.nome, 'pt', { numeric: true, sensitivity: 'base' }));

            const grupos = [];
            const porBase = {};
            itens.forEach(item => {
                if (item.sufixo) {
                    if (!porBase[item.base]) {
                        porBase[item.base] = [];
                        grupos.push(porBase[item.base]);
                    }
                    porBase[item.base].push(item);
                } else {
                    grupos.push([item]);
                }
            });
            return grupos;
        }

        function linhasDoProduto(cat, item) {
            const especial = cat.especiais && cat.especiais[item.codigo];
            const prefixo = cat.porPrefixo && Object.keys(cat.porPrefixo)
                .find(p => item.nome.toUpperCase().startsWith(p));
            return (especial && especial.descricao)
                || (prefixo && cat.porPrefixo[prefixo])
                || (item.sufixo && cat.variacoes && cat.variacoes[item.sufixo])
                || cat.descricao || [];
        }

        function criarInfo(cat, item) {
            const linhas = linhasDoProduto(cat, item);

            const info = document.createElement('div');
            info.className = 'card-info';
            info.innerHTML = `
                <div class="card-categoria"></div>
                <h3 class="card-titulo"></h3>
                <div class="card-descricao"></div>
                <a target="_blank" rel="noopener" class="botao-interesse">Tenho Interesse</a>`;
            info.querySelector('.card-categoria').textContent = cat.nome;
            info.querySelector('.card-titulo').textContent = item.nome;
            const boxDesc = info.querySelector('.card-descricao');
            linhas.forEach(l => {
                const p = document.createElement('p');
                p.textContent = l;
                boxDesc.appendChild(p);
            });
            info.querySelector('a').href = linkWhatsApp(item.nome);
            return info;
        }
        const codigoDe = (item) => item.codigo;

        function montarProdutos() {
            const grade = $('grade-produtos');
            CATEGORIAS.forEach(cat => {
                agruparProdutos(cat).forEach(grupo => {
                    const card = document.createElement('div');
                    card.dataset.categoria = cat.id;

                    if (grupo.length === 1) {
                        card.className = 'card produto';
                        card.appendChild(criarImagem(grupo[0].codigo, grupo[0].nome));
                        card.appendChild(criarInfo(cat, grupo[0]));
                    } else {
                        // variações lado a lado (ocupa o espaço de N cards)
                        const n = grupo.length;
                        card.className = 'card produto produto-grupo';
                        card.style.gridColumn = `span ${n}`;
                        const wrap = document.createElement('div');
                        wrap.className = 'grupo-itens';
                        wrap.style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`;
                        grupo.forEach(item => {
                            const v = document.createElement('div');
                            v.className = 'variacao';
                            v.appendChild(criarImagem(item.codigo, item.nome));
                            v.appendChild(criarInfo(cat, item));
                            wrap.appendChild(v);
                        });
                        card.appendChild(wrap);
                    }
                    grade.appendChild(card);
                });
            });
        }

        function montarGaleria() {
            const landing = $('landing-quem-somos');
            FOTOS_QUEM_SOMOS.forEach((codigo, i) => {
                landing.appendChild(criarImagem(codigo, `Neuza Petti — ${i + 1}`));
            });
        }

        // ================= NAVEGAÇÃO =================
        function mostrarSecao(nome) {
            ['inicio', 'catalogo', 'quem-somos'].forEach(s => {
                $('secao-' + s).classList.toggle('visivel', s === nome);
            });
            document.querySelectorAll('[data-ir]').forEach(a => {
                a.classList.toggle('ativo', a.dataset.ir === nome);
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function aplicarFiltro(cat) {
            document.querySelectorAll('.botao-filtro').forEach(b => {
                b.classList.toggle('ativo', b.dataset.categoria === cat);
            });
            document.querySelectorAll('.produto').forEach(p => {
                p.style.display = (cat === 'todos' || p.dataset.categoria === cat) ? '' : 'none';
            });
        }

        function mostrarCatalogo(cat = 'todos') {
            aplicarFiltro(cat);
            mostrarSecao('catalogo');
        }

        document.querySelectorAll('[data-ir]').forEach(a => {
            a.addEventListener('click', (e) => {
                e.preventDefault();
                const destino = a.dataset.ir;
                destino === 'catalogo' ? mostrarCatalogo('todos') : mostrarSecao(destino);
            });
        });
        $('btn-voltar').addEventListener('click', () => mostrarSecao('inicio'));

        // ================= INICIAR =================
        montarCategorias();
        montarFiltros();
        montarProdutos();
        montarGaleria();
        aplicarFiltro('todos');
        mostrarSecao('inicio');
    </script>
</body>
</html>
